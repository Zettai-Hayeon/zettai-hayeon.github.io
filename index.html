<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1a3a" />
  <title>Looking Through the Glass</title>

  <style>
    :root{
      --bg0:#f6f7fb;
      --bg1:#eef1f8;
      --ink:#0d1426;
      --muted:#65708a;

      --navy:#0e1a3a;
      --navy2:#1f2f66;

      --line:rgba(25,40,85,.16);
      --line2:rgba(25,40,85,.10);

      --panel:rgba(255,255,255,.82);
      --panel2:rgba(255,255,255,.58);

      --shadow: 0 22px 60px rgba(14, 26, 58, .10);
      --r:22px;
      --r2:16px;

      --focus: rgba(31,47,102,.18);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic", sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 420px at 15% -10%, rgba(31,47,102,.10), transparent 55%),
        radial-gradient(700px 360px at 95% 10%, rgba(14,26,58,.08), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }
    a{color:inherit;text-decoration:none}

    .wrap{max-width:1080px;margin:0 auto;padding:26px 16px 70px}


    /* FRAME */
    .frame{
      position:relative;
      border-radius: var(--r);
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.62));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .frame::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(1200px 500px at 10% 0%, rgba(31,47,102,.07), transparent 55%),
        radial-gradient(900px 480px at 90% 15%, rgba(14,26,58,.05), transparent 60%),
        linear-gradient(90deg, rgba(14,26,58,.04), transparent 12%, transparent 88%, rgba(14,26,58,.04));
      pointer-events:none;
    }

    .top{
      position:relative;
      padding: 18px 18px 12px;
      display:flex;
      flex-wrap: wrap;
      gap:16px;
      flex-direction: column;
      align-items:flex-start;
      align-content: center;
      border-bottom:1px solid var(--line2);
      backdrop-filter: blur(6px);
    }

    .titleBlock{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .titleSvg{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .titleSvg img{
      height:90px;
      width:auto;
      max-width: 520px;
      display:block;
    }

    .subtitle{
      margin:0;
      color:rgba(13,20,38,.62);
      font-weight:650;
      font-size:13px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .mainimg {
      height: auto;
      width: 100%;
      border-radius: 10px;
      display:block;
    }

    /* MENU */
    .menu{
      position:relative;
      padding: 12px 18px 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items: center;
      align-content: center;
      justify-content: center;
      border-bottom:1px solid var(--line2);
    }

    .tab{
      border:1px solid var(--line);
      background: rgba(255,255,255,.75);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight:800;
      font-size:13px;
      color: rgba(13,20,38,.78);
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, background .12s ease, border-color .12s ease;
    }
    .tab:hover{ transform: translateY(-1px); }
    .tab[aria-selected="true"]{
      background: rgba(31,47,102,.08);
      border-color: rgba(31,47,102,.25);
      color: var(--navy2);
      box-shadow: 0 0 0 4px var(--focus);
    }

    /* CONTENT */
    .content{
      position:relative;
      padding: 18px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:14px;
    }
    @media (max-width:900px){ .grid{grid-template-columns:1fr} }

    .right_wrapper {
      display:grid;
      gap:10px;
    }

    /* SPOILER */
    .spoiler{
      display:inline-block;
      padding:3px 6px;
      border-radius:6px;
      background: #0e1a3a;
      cursor:pointer;
      user-select:none;
      color: transparent;
      transition: color .16s ease, background .16s ease;
      outline:none;
    }
    .spoiler:focus{
      box-shadow: 0 0 0 4px rgba(31,47,102,.18);
    }
    .spoiler.is-open{
      color: rgba(13,20,38,.85);
      background: none;
      opacity:1;
    }

    .dday-panel{
      position:relative;
      border:none;
      padding:0;
      overflow:hidden;
      background:url("dday-bg.jpg") center/cover no-repeat;
      min-height:200px;
      color:white;
    }
    .dday-overlay{
      position:absolute;
      inset:0;
      background:url("dday-bg.jpg") center/cover no-repeat;
    }
    .dday-content{
      position:relative;
      padding:26px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      height:100%;
    }
    .dday-label{
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      opacity:.78;
      margin-bottom:10px;
    }
    .dday-number{
      font-size:56px;
      font-weight:900;
      letter-spacing:-.03em;
      line-height:1.05;
      word-break:keep-all;
    }
    .dday-sub{
      margin-top:14px;
      font-size:14px;
      opacity:.86;
      letter-spacing:.04em;
    }

    .panel{
      background: var(--panel);
      border:1px solid var(--line2);
      border-radius: var(--r2);
      padding: 14px;
      overflow:hidden;
    }

    .panelHeader{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:10px;
    }

    .panelTitle{
      margin:0;
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color: rgba(13,20,38,.62);
      font-weight:900;
    }

    .badge{
      font-size:11px;
      letter-spacing:.10em;
      text-transform:uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.6);
      color: rgba(13,20,38,.62);
      font-weight:850;
      white-space:nowrap;
    }

    .kvs{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:8px 12px;
      align-items:center;
      font-size:13px;
    }
    .kvs .k{
      color: rgba(13,20,38,.55);
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-size:12px;
    }
    .kvs .v{
      color: rgba(13,20,38,.86);
      font-weight:900;
    }

    .about b {
        color: #1f2f66;
        font-weight: 800;
    }

    .u {
        border-bottom: #1f2f66 1px solid;
    }

    .d {
        color: gold;
    }

    .p1{
      margin:0;
      color: rgba(13,20,38,.72);
      font-weight:650;
      line-height:1.7;
      font-size:18px;
      text-align: center;
    }

    .p2 {
        font-size: 1.1em;
    }

    .roximg {
        width: 100%;
        height: 250px;
        object-fit: cover;
        object-position: 50% 25%;
        border-radius: 10px;
    }

    .list {
        list-style: '💙 ' outside;
        line-height: 1.8em;
    }
    .list span {
        margin-bottom: 5px;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      justify-content: center;
      gap:8px;
      margin-top:10px;
    }
    .tag{
      border:1px solid var(--line2);
      background: rgba(255,255,255,.55);
      padding:7px 10px;
      border-radius: 12px;
      font-weight:850;
      font-size:12px;
      color: rgba(13,20,38,.70);
    }

    .linkList{ display:grid; gap:10px; }
    .linkRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid var(--line2);
      background: rgba(255,255,255,.62);
      transition: transform .08s ease, border-color .12s ease;
    }
    .linkRow:hover{
      transform: translateY(-1px);
      border-color: rgba(31,47,102,.22);
    }
    .linkRow small{
      color: rgba(13,20,38,.55);
      font-weight:750;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace;
      font-size:12px;
      color: rgba(13,20,38,.62);
      border:1px solid var(--line2);
      background: rgba(255,255,255,.6);
      padding: 5px 8px;
      border-radius: 10px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .footer{
      padding: 12px 18px 16px;
      border-top:1px solid var(--line2);
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color: rgba(13,20,38,.50);
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .swap{ animation: fade .16s ease-out; }
    @keyframes fade{
      from{opacity:.0; transform: translateY(2px)}
      to{opacity:1; transform: translateY(0)}
    }
  </style>
</head>

    };

    function setView(key){
      $tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === key)));
      $content.innerHTML = views[key] ? views[key]() : views.overview();

      if (key === 'overview') startDDayRenderRetry();
    }

    $tabs.forEach(t => {
      t.addEventListener('click', () => setView(t.dataset.view));
    });

    document.addEventListener('click', (e) => {
      const el = e.target.closest('.spoiler');
      if(!el) return;
      el.classList.toggle('is-open');
      el.setAttribute('aria-pressed', el.classList.contains('is-open'));
    });

    document.addEventListener('keydown', (e) => {
      if(e.key !== 'Enter' && e.key !== ' ') return;
      const el = document.activeElement;
      if(!el || !el.classList.contains('spoiler')) return;
      e.preventDefault();
      el.classList.toggle('is-open');
      el.setAttribute('aria-pressed', el.classList.contains('is-open'));
    });

    const COUPLE_START = new Date(2025, 10, 30); // 2025-11-30 (month: 0-based)

    function getTodayMidnight(){
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function daysTogether(){
      const today = getTodayMidnight();
      return Math.floor((today.getTime() - COUPLE_START.getTime()) / 86400000);
    }

    function renderDDay(){
      const numberEl = document.getElementById('ddayNumber');
      const subEl = document.getElementById('ddaySub');
      if (!numberEl || !subEl) return false;

      const days = Math.max(0, daysTogether());
      numberEl.textContent = `${days} DAYS TOGETHER`;

      const milestones = [100, 200, 300, 365, 500, 730];
      const next = milestones.find(m => m > days);
      subEl.textContent = next
        ? `Next · ${next} DAYS (D-${next - days})`
        : `Still writing our story.`;

      return true;
    }

    function startDDayRenderRetry(){
      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        const ok = renderDDay();
        if (ok || tries >= 40) clearInterval(timer);
      }, 50);
    }

    setView('overview');
  </script>
</body>
</html>
